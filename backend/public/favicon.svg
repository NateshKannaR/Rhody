<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="50%" stop-color="#07090E"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" />

  <circle cx="256" cy="256" r="160" fill="#00F0FF" opacity="0.08" filter="url(#neonGlow)"/>

  <path d="M 120 330 C 220 320 280 270 340 190 C 370 150 410 160 430 165" 
        fill="none" stroke="url(#curveGrad)" stroke-width="8" stroke-linecap="round" opacity="0.9" filter="url(#neonGlow)"/>
  
  <path d="M 150 350 C 235 340 295 285 355 210 C 385 170 415 180 435 185" 
        fill="none" stroke="url(#curveGrad)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <path d="M 180 370 C 250 360 305 305 365 235 C 395 200 420 205 440 210" 
        fill="none" stroke="url(#curveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

  <circle cx="365" cy="180" r="4.5" fill="#34D399" filter="url(#neonGlow)"/>
  <circle cx="400" cy="162" r="3.5" fill="#00F0FF" filter="url(#neonGlow)"/>
  <circle cx="430" cy="165" r="5" fill="#6EE7B7" filter="url(#neonGlow)"/>

  <polygon points="275,80 170,265 255,265 220,432 355,235 270,235"
           fill="url(#boltGrad)" filter="url(#neonGlow)" stroke="#F0FDFA" stroke-width="3" stroke-linejoin="round"/>
</svg>
